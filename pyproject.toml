[build-system]
# 77 is the first setuptools that implements PEP 639: a `license` SPDX expression
# and `license-files` in [project]. Older ones reject the string form outright.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verilore"
version = "0.10.0"
description = "Versioned, evidence-backed memory for AI apps: every answer cites its source and the time it was true."
# The PyPI page. Not README.md: its relative links render broken on PyPI.
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
# The upper bound is the first Python that some dependency ships no wheel for:
# onnxruntime has none for 3.15 yet, so on Fedora 45's default Python the install
# failed in the resolver with an ABI-tag error. With the bound, an installer says
# "requires Python <3.15" and uv picks a Python that fits. Raise it when the
# "Installs and runs on Python" CI job passes on the next version.
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Raunak Dey"}]
keywords = ["memory", "rag", "llm", "provenance", "pgvector", "mcp", "ai-agents"]
# Only what CI runs: Python 3.11 to 3.14, on Linux and macOS. Add a version or an
# OS here when a CI job installs there; tests/test_release_packaging.py holds the
# two together.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # A floor, not a pin: 0.30.0 ships no wheel for Python 3.14, so the pin made
    # every 3.14 install compile asyncpg from source.
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    # Declared here, not only in requirements.txt. `pip install verilore` is a
    # documented install path in the README, and the documented migrate step
    # is `python -m alembic ...`. Without this the bare wheel has no alembic and
    # that step fails with "No module named alembic" on a clean machine.
    "alembic>=1.13.0",
    # The embedding stack. ONNX Runtime runs the same published MiniLM weights
    # with no torch in the process: a cold `recall` measures 1.4 s against 7.6 s
    # for sentence-transformers, and the install is 90 MB against 5.1 GB.
    # `verilore/api/services/embedder.py` documents the equivalence measurement
    # (min cosine 0.99999833) that makes the two interchangeable, and
    # `tests/test_embedder_backend_equivalence.py` asserts it per text.
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyyaml>=6.0",
    "langchain-text-splitters>=1.0.0",
    # Typer is core because `verilore` is an unconditional console script in
    # [project.scripts], and a conditional entry point is not something setuptools
    # can express. Declared as an extra, a bare `pip install verilore` created
    # a `verilore` executable that died with ModuleNotFoundError on `import typer`
    # -- and the wheel job never caught it, because `transformers` depends on typer
    # and `transformers` used to arrive with `sentence-transformers`. Removing that
    # default dependency removed the accidental transit and exposed it.
    #
    # `rich` is not listed: typer requires it, and nothing here imports it directly.
    # A direct dependency you do not import is a version constraint you have to keep
    # true by hand.
    "typer>=0.9.0",
    # `verilore init` applies the schema itself, and the migrations need both:
    # `migrations/env.py` runs on the sync psycopg2 driver and 001 creates the
    # pgvector column type. As an extra, a bare `uv tool install` or
    # `pipx install` got a `verilore init` that could not migrate -- the
    # install the README and the website show.
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
]
[project.urls]
Homepage = "https://github.com/raunakdey-07/verilore"
Repository = "https://github.com/raunakdey-07/verilore"
Documentation = "https://github.com/raunakdey-07/verilore/blob/main/docs/integration/guide.md"
Changelog = "https://github.com/raunakdey-07/verilore/blob/main/CHANGELOG.md"
Issues = "https://github.com/raunakdey-07/verilore/issues"

[project.optional-dependencies]
# Empty, and kept because the README, the quickstart and every operator's notes say
# `pip install -e '.[cli,mcp]'`. Removing it would break those install lines to save
# four characters. `[cli]` now means "the CLI, which you already have".
cli = []
mcp = ["mcp>=1.2.0"]
# Kept so existing `pip install 'verilore[migrations]'` lines still resolve; the
# three packages are core dependencies now, because `init` migrates.
migrations = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
]
# The slow backend, for a deployment that wants it. Installing this alongside the
# default stack does not change what a cold command does: `verilore.api.services.embedder`
# prefers onnxruntime when it imports and only falls back to sentence-transformers
# when it does not. Use `MEMORY_EMBEDDER=torch` to force the fallback and compare.
torch = ["sentence-transformers>=2.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
# The console scripts resolve through the installed `verilore` package, so a
# bare `pip install verilore` gives working `verilore`, `verilore-proof` and
# `verilore-mcp` executables with no generic top-level names on the path.
verilore = "verilore.cli.main:app"
# Standalone, dependency-free proof tooling. A separate entry point, not a
# subcommand of the Typer CLI, because the verifier needs nothing but the
# standard library: anyone holding a proof must be able to check it without
# the CLI's dependencies.
verilore-proof = "verilore.proof_cli:main"
# The MCP server, as a command an agent can actually launch. Same reason: an
# agent configuration should not have to know a module path or a virtualenv.
verilore-mcp = "verilore.mcp_server:main"

[tool.setuptools]
# Only the `verilore` package ships, plus the two one-release shims below.
# memory_pack, memory_proof, memory_proof_cli, memory_receipt and mcp_server now
# live inside the verilore package (verilore.pack, verilore.proof, ...), so they
# are not top-level names any more and no longer collide with a consumer's own
# `api/` package.
py-modules = [
    "verilore_sdk",
    "verilore_errors",
]

[tool.setuptools.packages.find]
where = ["."]
# Only the verilore package ships. `scripts/` is release, benchmark and
# research tooling that nothing imports at runtime -- 48 of the 54 files there
# are `scripts/benchmark/`. It stayed in the distribution because `scripts*` has
# been in this list since v0.6.0. Removing it takes the wheel from 425 KB / 129
# files to 227 KB / 74, measured, and no installed consumer loses anything:
# the console scripts, `py-modules` and every `verilore.api`/`verilore.cli`
# import are unaffected. The repository still ships them, which is where
# `check_versioning.py`, `check_evidence.py` and the benchmark harnesses run from.
include = ["verilore*"]

[tool.setuptools.package-data]
# `verilore/migrations` is a package (see its `__init__.py`) for exactly this
# reason: a wheel that ships no migration scripts cannot apply its own schema,
# and the documented third step of the README -- `python -m alembic -c
# verilore/migrations/alembic.ini upgrade head` -- has nothing to point at.
# Measured: the bare wheel was 13 MB with no alembic and no migrations, so
# `pip install verilore` could not reach a working first command.
"verilore.migrations" = ["alembic.ini", "*.mako", "versions/*.py", "versions/*.mako"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repository root goes on sys.path for EVERY pytest invocation, not just
# `python -m pytest`.
#
# Three test modules import `scripts.benchmark.*` and `scripts.m009_*`, and
# `scripts/__init__.py` exists so it is an importable package. Under
# `python -m pytest` the working directory is prepended to sys.path and those
# imports resolve. Under the `pytest` console script they do not -- and CI runs
# `pytest -q`, so the first real runner to execute this branch failed collection
# with `ModuleNotFoundError: No module named 'scripts'` in three modules.
#
# The difference is not about the code under test. It is that a developer runs
# `python -m pytest` out of habit and CI runs `pytest` because that is what you
# type, so the only place the difference shows up is the machine nobody had
# looked at yet. Setting the path here makes both invocations identical, and
# makes any future invocation identical too.
pythonpath = ["."]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.ruff]
target-version = "py311"
line-length = 100